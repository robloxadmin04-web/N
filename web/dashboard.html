<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Servers - Helium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="mark mark-sm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z"/>
        <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <div class="title">
      <h1>Servers</h1>
      <div class="meta" id="who"></div>
    </div>

    <a class="iconbtn" href="help.html" title="How to use Helium">
      <span class="sr-only">How to use Helium</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="8" cy="8" r="6.25"/>
        <path d="M6.3 6.1a1.75 1.75 0 1 1 2.2 2.05c-.4.13-.5.4-.5.75v.35"/>
        <path d="M8 11.7h.01"/>
      </svg>
    </a>

    <button class="iconbtn" id="signout" type="button" title="Sign out">
      <span class="sr-only">Sign out</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 14H3.5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1H6"/>
        <path d="M10.5 11.5 14 8l-3.5-3.5M14 8H6"/>
      </svg>
    </button>
  </div>
</header>

<main class="page">

  <div id="managed"></div>
  <div id="available"></div>

  <div class="divider"></div>

  <a class="btn btn-quiet btn-block" id="invite" target="_blank" rel="noopener">
    <span id="inviteIcon"></span>
    <span>Add Helium to another server</span>
  </a>

  <p class="footnote">Only servers where you have Manage Server are listed.</p>

</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  var session = await requireAuth();
  if (!session) return;

  document.getElementById('signout').addEventListener('click', signOut);
  document.getElementById('invite').href = botInviteUrl(null);
  document.getElementById('inviteIcon').innerHTML = icon('plus');

  var meta = session.user.user_metadata || {};
  document.getElementById('who').textContent =
    meta.full_name || meta.name || meta.user_name || '';

  var managed = document.getElementById('managed');
  var available = document.getElementById('available');

  managed.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';

  var guilds;
  try {
    var data = await api('/api/guilds');
    guilds = data.guilds || [];
  } catch (e) {
    managed.innerHTML = emptyState('Could not load your servers', e.message);
    return;
  }

  if (guilds.length === 0) {
    managed.innerHTML = emptyState(
      'No servers found',
      'You need the Manage Server permission on at least one Discord server.'
    );
    return;
  }

  guilds.sort(function (a, b) { return a.name.localeCompare(b.name); });

  var active = guilds.filter(function (g) { return g.bot_present; });
  var pending = guilds.filter(function (g) { return !g.bot_present; });

  function activeRow(g) {
    var members = g.member_count
      ? icon('users') + '<span>' + esc(g.member_count) + ' members</span>'
      : '<span>Connected</span>';

    return (
      '<a class="row-link" href="server.html?id=' + esc(g.id) + '">' +
        guildAvatar(g) +
        '<div class="row-body">' +
          '<div class="row-title">' + esc(g.name) + '</div>' +
          '<div class="row-meta">' + members +
            (g.premium ? '<span class="badge solid">Premium</span>' : '') +
          '</div>' +
        '</div>' +
        '<span style="color:var(--text-faint);width:16px;height:16px">' + icon('chevron') + '</span>' +
      '</a>'
    );
  }

  function pendingRow(g) {
    return (
      '<div class="row-link">' +
        guildAvatar(g) +
        '<div class="row-body">' +
          '<div class="row-title">' + esc(g.name) + '</div>' +
          '<div class="row-meta"><span>Helium is not installed</span></div>' +
        '</div>' +
        '<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="' +
          esc(botInviteUrl(g.id)) + '">Install</a>' +
      '</div>'
    );
  }

  managed.innerHTML = active.length
    ? '<div class="section-label">Connected</div>' + active.map(activeRow).join('')
    : emptyState('Helium is not installed yet', 'Pick a server below to get started.');

  available.innerHTML = pending.length
    ? '<div class="section-label">Available</div>' + pending.map(pendingRow).join('')
    : '';
})();
</script>

</body>
</html>
