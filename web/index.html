<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in - Helium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth">
  <div class="auth-card">

    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z"/>
        <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1>Helium</h1>
    <p class="auth-sub">Server management for Discord communities. Enter your access key to continue.</p>

    <div id="stepKey">
      <div class="field">
        <label class="lbl" for="accessKey">Access key</label>
        <input type="text" id="accessKey" placeholder="KEY-XXXXXXXX-XXXXXXXX" autocomplete="off" spellcheck="false">
      </div>
      <button id="keyBtn" class="btn btn-primary btn-block btn-lg" type="button">Continue</button>
    </div>

    <div id="stepDiscord" style="display:none">
      <button id="signin" class="btn btn-primary btn-block btn-lg" type="button">
        <span id="signinIcon"></span>
        <span id="signinLabel">Continue with Discord</span>
      </button>
      <ul class="auth-perms" id="perms"></ul>
    </div>

  </div>

  <p class="auth-foot">Access is limited. If your key does not work, contact the owner.</p>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  var stepKey = document.getElementById('stepKey');
  var stepDiscord = document.getElementById('stepDiscord');
  var keyInput = document.getElementById('accessKey');
  var keyBtn = document.getElementById('keyBtn');
  var signinBtn = document.getElementById('signin');
  var signinLabel = document.getElementById('signinLabel');

  function showDiscordStep() {
    stepKey.style.display = 'none';
    stepDiscord.style.display = 'block';
    document.getElementById('signinIcon').innerHTML = icon('discord');
    document.getElementById('perms').innerHTML =
      ['Reads the list of servers you can manage',
       'Never reads your messages or direct messages',
       'You can revoke access from Discord at any time']
        .map(function (t) { return '<li>' + icon('check') + '<span>' + esc(t) + '</span></li>'; })
        .join('');
  }

  var session = await getSession();
  if (session) { window.location.replace('dashboard.html'); return; }

  if (hasPassedGate()) showDiscordStep();

  async function submitKey() {
    var key = keyInput.value.trim();
    if (!key) { notify('Enter your access key.', 'error'); return; }
    keyBtn.disabled = true;
    keyBtn.textContent = 'Checking';
    try {
      await checkAccessKey(key);
      showDiscordStep();
    } catch (e) {
      notify(e.message, 'error');
      keyBtn.disabled = false;
      keyBtn.textContent = 'Continue';
    }
  }

  keyBtn.addEventListener('click', submitKey);
  keyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitKey(); });

  signinBtn.addEventListener('click', function () {
    signinBtn.disabled = true;
    signinLabel.textContent = 'Redirecting';
    signIn();
  });
})();
</script>

</body>
</html>
