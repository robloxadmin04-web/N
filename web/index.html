<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Manage your Discord server settings, premium members and status board from one place.">
<title>Sign in - Helium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth">
  <div class="auth-card">

    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z"/>
        <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1>Helium</h1>
    <p class="auth-sub">Server management for Discord communities. Settings, roles and updates in one place.</p>

    <button id="signin" class="btn btn-primary btn-block btn-lg" type="button">
      <span id="signinIcon"></span>
      <span id="signinLabel">Continue with Discord</span>
    </button>

    <ul class="auth-perms" id="perms"></ul>

  </div>

  <p class="auth-foot">You will be redirected to Discord to authorize access.</p>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  document.getElementById('signinIcon').innerHTML = icon('discord');

  document.getElementById('perms').innerHTML =
    ['Reads the list of servers you can manage',
     'Never reads your messages or direct messages',
     'You can revoke access from Discord at any time']
      .map(function (text) {
        return '<li>' + icon('check') + '<span>' + esc(text) + '</span></li>';
      }).join('');

  var btn = document.getElementById('signin');
  var label = document.getElementById('signinLabel');

  btn.addEventListener('click', function () {
    btn.disabled = true;
    label.textContent = 'Redirecting';
    signIn();
  });

  var session = await getSession();
  if (session) window.location.replace('dashboard.html');
})();
</script>

</body>
</html>
